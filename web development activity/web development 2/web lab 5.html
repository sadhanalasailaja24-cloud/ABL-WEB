<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input:focus,
        select:focus {
            border: 2px solid blue;
            outline: none;
        }

        .gender {
            margin-bottom: 15px;
        }

        .gender label {
            display: inline;
            font-weight: normal;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            width: auto;
            padding: 10px 20px;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        input[type="submit"] {
            background-color: green;
        }

        input[type="reset"] {
            background-color: gray;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }

        input[type="reset"]:hover {
            background-color: gray;
        }
    </style>
</head>
<body>

    <div class="form-container">

        <h2>User Registration</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name"
                   required>


            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>


            <label for="phone">Mobile Number:</label>
            <input type="tel"
                   id="phone"
                   name="phone"
				   pattern="[0-9]{10}"
                   placeholder="Enter mobile number"
                   required>


            <label for="country">Country:</label>

            <select id="country" name="country">

                <option value="">-- Select Country --</option>
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>

            </select>


            <div class="gender">

                <label>Gender:</label>

                <input type="radio"
                       id="male"
                       name="gender"
                       value="male">

                <label for="male">Male</label>

                <input type="radio"
                       id="female"
                       name="gender"
                       value="female">

                <label for="female">Female</label>

            </div>

            <div class="buttons">

                <input type="submit"
                       value="Register">

                <input type="reset"
                       value="Clear">
            </div>
        </form>
    </div>
</body>
</html>
