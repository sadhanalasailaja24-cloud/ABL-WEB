<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voter Registration Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px #999;
        }
        h1 {
            text-align: center;
            color: #1b4f72;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group > label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1b4f72;
            outline: none;
        }

        .option {
            display: inline-block;
            margin-right: 20px;
            font-weight: normal;
        }

        .option input {
            margin-right: 5px;
        }

        fieldset {
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: #1b4f72;
            padding: 0 10px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        input[type="submit"] {
            background-color: #1b4f72;
        }

        input[type="reset"] {
            background-color: #777;
        }

        input[type="submit"]:hover {
            background-color: #154360;
        }

        input[type="reset"]:hover {
            background-color: #555;
        }
        .declaration {
            background-color: #f5f5f5;
            padding: 15px;
            border-left: 4px solid #1b4f72;
            margin-top: 10px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Voter Registration Form</h1>

        <p class="description">
            Please enter your details carefully.
        </p>

        <form action="#" method="post">

    

            <fieldset>

                <legend>Personal Information</legend>

                <div class="form-group">

                    <label for="fullname">
                        Full Name:
                    </label>

                    <input type="text"
                           id="fullname"
                           name="fullname"
                           placeholder="Enter your full name"
                           required>

                </div>


                <div class="form-group">

                    <label for="fathername">
                        Father's / Mother's Name:
                    </label>

                    <input type="text"
                           id="fathername"
                           name="fathername"
                           placeholder="Enter parent/guardian name"
                           required>

                </div>


                <div class="form-group">

                    <label for="dob">
                        Date of Birth:
                    </label>

                    <input type="date"
                           id="dob"
                           name="dob"
                           required>

                </div>


                <div class="form-group">

                    <label>Gender:</label>

                    <label class="option">
                        <input type="radio"
                               name="gender"
                               value="Male"
                               required>
                        Male
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="gender"
                               value="Female">
                        Female
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="gender"
                               value="Other">
                        Other
                    </label>

                </div>

            </fieldset>


            <fieldset>

                <legend>Contact Information</legend>

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number:
                    </label>

                    <input type="tel"
                           id="mobile"
                           name="mobile"
                           placeholder="Enter 10-digit mobile number"
                           pattern="[0-9]{10}"
                           required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address:
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@gmail.com">

                </div>

            </fieldset>

            <fieldset>

                <legend>Address Details</legend>

                <div class="form-group">

                    <label for="address">
                        Residential Address:
                    </label>

                    <textarea id="address"
                              name="address"
                              placeholder="Enter your complete residential address"
                              required></textarea>

                </div>


                <div class="form-group">

                    <label for="state">
                        State:
                    </label>

                    <select id="state"
                            name="state"
                            required>

                        <option value="">
                            --select state--
                        </option>

                        <option value="andhra-pradesh">
                            Andhra Pradesh
                        </option>

                        <option value="telangana">
                            Telangana
                        </option>

                        <option value="tamil-nadu">
                            Tamil Nadu
                        </option>

                        <option value="karnataka">
                            Karnataka
                        </option>

                        <option value="kerala">
                            Kerala
                        </option>

                        <option value="maharashtra">
                            Maharashtra
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="district">
                        District:
                    </label>

                    <input type="text"
                           id="district"
                           name="district"
                           placeholder="Enter district"
                           required>

                </div>


                <div class="form-group">

                    <label for="pincode">
                        PIN Code:
                    </label>

                    <input type="text"
                           id="pincode"
                           name="pincode"
                           placeholder="Enter 6-digit PIN code"
                           pattern="[0-9]{6}"
                           required>

                </div>

            </fieldset>

            <fieldset>

                <legend>Identification Details</legend>

                <div class="form-group">

                    <label for="idtype">
                        Identity Document:
                    </label>

                    <select id="idtype"
                            name="idtype"
                            required>

                        <option value="">
                            -- Select Document --
                        </option>

                        <option value="aadhaar">
                            Aadhaar
                        </option>

                        <option value="passport">
                            Passport
                        </option>

                        <option value="driving-license">
                            Driving Licence
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="idnumber">
                        Identification Number:
                    </label>

                    <input type="text"
                           id="idnumber"
                           name="idnumber"
                           placeholder="Enter identification number">

                </div>


                <div class="form-group">

                    <label for="document">
                        Upload Supporting Document:
                    </label>

                    <input type="file"
                           id="document"
                           name="document"
                           accept=".pdf,.jpg,.jpeg,.png">

                </div>

            </fieldset>

            <fieldset>

                <legend>Declaration</legend>

                <div class="declaration">

                    <label class="option">

                        <input type="checkbox"
                               id="declaration"
                               name="declaration"
                               required>

                        I declare that the information provided
                        by me is correct to the best of my knowledge.

                    </label>

                </div>

            </fieldsset>

            <div class="buttons">

                <input type="submit"
                       value="Submit Registration">

                <input type="reset"
                       value="Clear Form">

            </div>

        </form>

    </div>

</body>

</html>
